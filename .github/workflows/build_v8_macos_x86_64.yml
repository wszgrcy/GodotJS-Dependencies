name: v8-macos-x86_64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        if: ${{ vars.HOST_MACOS != 'true' }}
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Fetch v8
        run: |
          cd $GITHUB_WORKSPACE
          pwd

          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD

          # The vpython3_common sync hook cannot succeed for older V8 versions on
          # an Apple Silicon runner: their .vpython3 spec pins python 3.8, and the
          # Chromium package index no longer serves numpy==1.21.1+supported.1 for
          # cp38/macos-arm64 (crbug.com/492362903). That hook only pre-builds a
          # python virtualenv, and nothing in a v8_monolith build runs through
          # vpython3, so shadow it for this step only. Every other hook - clang
          # toolchain, LASTCHANGE, dsymutil - still runs normally.
          mkdir -p $GITHUB_WORKSPACE/hook-shim
          printf '#!/bin/sh\necho "[shim] skipping vpython3"\nexit 0\n' > $GITHUB_WORKSPACE/hook-shim/vpython3
          chmod +x $GITHUB_WORKSPACE/hook-shim/vpython3
          export PATH=$GITHUB_WORKSPACE/hook-shim:$PATH

          gclient sync -D --force --reset

          # Stop here, with a clear message, if the sync left out what the build
          # actually needs.
          test -x $GITHUB_WORKSPACE/v8/v8/third_party/llvm-build/Release+Asserts/bin/clang || {
            echo "clang toolchain is missing after gclient sync"
            exit 1
          }

      - name: Build v8 x86_64
        run: |
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd $GITHUB_WORKSPACE/v8/v8
          python ./tools/dev/v8gen.py x64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.macos_x86_64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn
          ls -l $GITHUB_WORKSPACE/depot_tools/ninja 
          ls -l $GITHUB_WORKSPACE/depot_tools/autoninja 
          ninja -C ./out.gn/x64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/macos.x86_64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/obj/libv8_monolith.a staging/v8/macos.x86_64.release/

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_macos_x86_64
          path: staging/
