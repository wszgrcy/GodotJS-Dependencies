name: v8-macos-x86_64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        if: ${{ vars.HOST_MACOS != 'true' }}
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Fetch v8
        run: |
          cd $GITHUB_WORKSPACE
          pwd

          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD

          # The vpython3_common hook can never finish here: V8 12.x pins python 3.8
          # in .vpython3, and the Chromium package index no longer serves
          # numpy==1.21.1+supported.1 for cp38/macos-arm64 (crbug.com/492362903).
          # The hook only pre-builds a python virtualenv, and nothing in a
          # v8_monolith build is launched through vpython3 - in the build files
          # .vpython3 appears only as `data = [".vpython3"]` on test targets.
          # Dropping one named hook is what .gclient's custom_hooks is for: a
          # custom hook without an action replaces the DEPS hook of that name and
          # runs nothing. Every other hook - clang toolchain, LASTCHANGE, dsymutil
          # - still runs.
          cd $GITHUB_WORKSPACE/v8
          gclient config --spec "solutions = [{'name': 'v8', 'url': 'https://chromium.googlesource.com/v8/v8.git', 'deps_file': 'DEPS', 'custom_deps': {}, 'custom_hooks': [{'name': 'vpython3_common', 'pattern': '.'}]}]"
          cd v8
          gclient sync -D --force --reset

          # Stop here, with a clear message, if the sync left out what the build
          # actually needs.
          test -x $GITHUB_WORKSPACE/v8/v8/third_party/llvm-build/Release+Asserts/bin/clang || {
            echo "clang toolchain is missing after gclient sync"
            exit 1
          }

          # //build has to land on the revision this V8 tag pins. A newer //build
          # renamed exec_script_whitelist to exec_script_allowlist, and then gn gen
          # fails inside //.gn with a message that says nothing about the version
          # mismatch, so report the real problem here instead.
          BUILD_PIN=$(gclient getdep -r build --deps-file=$GITHUB_WORKSPACE/v8/v8/DEPS)
          BUILD_HEAD=$(git -C $GITHUB_WORKSPACE/v8/v8/build rev-parse HEAD)
          if [ "$BUILD_HEAD" != "$BUILD_PIN" ]; then
            echo "gclient sync did not process the tag's DEPS: //build is at $BUILD_HEAD, expected $BUILD_PIN"
            exit 1
          fi

      - name: Build v8 x86_64
        run: |
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd $GITHUB_WORKSPACE/v8/v8
          # -vv makes v8gen print the output of the command it fails on.
          python ./tools/dev/v8gen.py -vv x64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.macos_x86_64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn
          ls -l $GITHUB_WORKSPACE/depot_tools/ninja 
          ls -l $GITHUB_WORKSPACE/depot_tools/autoninja 
          ninja -C ./out.gn/x64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/macos.x86_64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/obj/libv8_monolith.a staging/v8/macos.x86_64.release/

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_macos_x86_64
          path: staging/
