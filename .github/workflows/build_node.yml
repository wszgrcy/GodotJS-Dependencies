name: node (all platforms)

# One workflow with a matrix, instead of one file per platform like the V8 jobs:
# every Node platform is built with the same steps (configure from
# node.<platform>_<arch>.configure.txt, package_node.sh, verify_node_bundle.sh),
# so the only per-platform differences are the runner, the args file, and the
# toolchain setup. The V8 jobs each need their own depot_tools workaround, which
# is why they are separate files.
#
# Android is in the matrix and cross-compiled with the NDK. Upstream says Android
# is not a supported platform and has no CI for it, so the cross toolchain is handed
# to configure through gyp's environment variables - see node.android_*.configure.txt
# and prepare_node_build.sh (Node's own ./android-configure sets the same things and
# then calls ./configure). The bundle check for those targets is compile-and-link with
# the NDK compiler, not a run (there is no device), which still catches a missing
# archive, a wrong --whole-archive group, or an ABI mismatch.

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'node version, without the leading v'
        type: string
        required: false
        default: '26.13.1'
      only:
        description: 'limit the matrix to one platform (linux|macos|windows|android|ios), empty = all'
        type: string
        required: false
        default: ''
      release_tag:
        description: 'release each finished platform is published into (created if missing); empty = node-<version>'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
      only:
        required: false
        type: string
        default: ''
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  # "Publish this platform's bundle" adds a release asset from inside a matrix job,
  # which needs write access; nothing else here writes to the repository.
  contents: write

jobs:
  # The matrix is built here rather than written out on the job, because the
  # `only` filter has to remove whole matrix entries and a job-level `if` cannot
  # see `matrix`. build_all.yml passes `only` once per platform, so that
  # vars.SKIP_WINDOWS and vars.SKIP_APPLE switch platforms off the way they do for
  # the V8 jobs, and a skipped platform still counts as "not a failure" when the
  # release assets are assembled.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      entries: ${{ steps.pick.outputs.entries }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          entries = [
            {"platform": "linux", "arch": "x86_64", "runner": "ubuntu-24.04"},
            # Native arm64 runner: Node builds its own V8 snapshot with a
            # host-arch mksnapshot, which a cross build cannot do without qemu.
            {"platform": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
            {"platform": "macos", "arch": "arm64", "runner": "macos-latest"},
            # macOS x86_64 is cross-built on the arm64 runner, which splits Node's
            # toolset and therefore needs the two fixes prepare_node_build.sh carries
            # (docs/node-26.md section 10.1). Native Intel images exist but are not
            # usable by default: every hosted Intel macOS label is a *larger* runner
            # (macos-15-intel / macos-15-large, macos-26-intel / macos-26-large), and
            # GitHub offers larger runners only on the Team and Enterprise Cloud
            # plans, so on a Free or Pro account the job would queue and never start.
            # Switch here if this repository ever gets such a plan.
            {"platform": "macos", "arch": "x86_64", "runner": "macos-latest",
             "cargo_target": "x86_64-apple-darwin"},
            {"platform": "windows", "arch": "x86_64", "runner": "windows-2022"},
            # arm64 Windows is not in the matrix. Building it from this x64 runner runs
            # into three separate gaps, each checked locally by generating the ninja
            # files with the Windows flavour:
            #   - the host toolset: gyp gives the host and the target toolset the same
            #     architecture (obj.host/*/….ninja said `arch = environment.arm64`), and
            #     the build-time tools (mksnapshot, torque) have to run on the runner.
            #   - the compiler: gyp's clang-cl hook only adds -m64/-m32, and clang-cl on
            #     an x64 host cannot emit arm64 objects without also being given
            #     --target=aarch64-windows-msvc. Upstream reaches that through MSBuild's
            #     ClangCL toolset (vcbuild), which the ninja path cannot see.
            #   - Temporal: with a split toolset the Rust archive collides (ninja: multiple
            #     rules generate gen/arm64/release/node_crates.lib), and Node's own fix
            #     (patches/node-66823-rust-host-target.patch) skips Windows on purpose.
            # A native arm64 Windows runner removes all three (no toolset split, clang-cl
            # targets its own architecture), so add the entry back there:
            #   {"platform": "windows", "arch": "arm64", "runner": "<native arm64>"}
            # The argument file node.windows_arm64.configure.txt is kept as the recipe.
            # Cross builds: the host machine is the same Linux x86_64 runner for
            # all three, the target differs. Host tools (mksnapshot, the JS snapshot
            # blob) are still built with the host compiler, which is what makes
            # these work without qemu.
            {"platform": "android", "arch": "arm64", "runner": "ubuntu-24.04",
             "cargo_target": "aarch64-linux-android"},
            {"platform": "android", "arch": "arm32", "runner": "ubuntu-24.04",
             "cargo_target": "armv7-linux-androideabi"},
            {"platform": "android", "arch": "x86_64", "runner": "ubuntu-24.04",
             "cargo_target": "x86_64-linux-android"},
            # iOS: built from a macOS runner with wrapper compilers that bake in the
            # iPhoneOS SDK (gyp has no ios flavour). Same CPU as the runner, so the
            # args file passes --cross-compiling to get the host toolset it needs to
            # run mksnapshot. See node.ios_arm64.configure.txt.
            {"platform": "ios", "arch": "arm64", "runner": "macos-latest",
             "cargo_target": "aarch64-apple-ios"},
          ]

          for entry in entries:
              entry.setdefault("cargo_target", "")

          only = os.environ.get("ONLY", "").strip()
          if only:
              entries = [e for e in entries if e["platform"] == only]
              if not entries:
                  raise SystemExit(
                      f"only={only}: expected one of linux, macos, windows")

          print(f"entries={json.dumps(entries)}")
          PY

  node:
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.pick.outputs.entries) }}
    name: node ${{ matrix.entry.platform }} ${{ matrix.entry.arch }}
    runs-on: ${{ matrix.entry.runner }}
    # A full Node build takes about 26 minutes on a 16-core machine (measured for
    # this bundle); a 4-core runner needs several times that. This is a hang guard,
    # not a budget: the GitHub default of 360 minutes is too long to wait on a build
    # that stopped making progress.
    timeout-minutes: 240
    defaults:
      run:
        # Plain `bash`. The runner looks the interpreter up on PATH, so on macOS the
        # Homebrew bash installed by the Toolchain step is what runs these steps.
        # A literal also sidesteps which contexts an expression here may use.
        shell: bash
    env:
      NODE_VERSION: ${{ inputs.node_version }}
      NODE_PLATFORM: ${{ matrix.entry.platform }}
      NODE_ARCH: ${{ matrix.entry.arch }}
      ARGS_FILE: node.${{ matrix.entry.platform }}_${{ matrix.entry.arch }}.configure.txt
      # Where a finished platform publishes its bundle. Empty means node-<version>,
      # computed in the step so the rule lives in one place.
      RELEASE_TAG: ${{ inputs.release_tag }}
      # Bionic API level the NDK wrappers target. 28 matches the minimum the Godot
      # Android export templates use.
      NODE_ANDROID_API: ${{ vars.NODE_ANDROID_API || '28' }}
      # iPhoneOS deployment target for the iOS wrappers. Same value gode and
      # moluopro/libnode use for their shipped libnode.
      NODE_IOS_DEPLOYMENT: ${{ vars.NODE_IOS_DEPLOYMENT || '16.0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Developer environment for Visual Studio
        if: ${{ matrix.entry.platform == 'windows' }}
        # The same procedure Node's own vcbuild.bat runs - find Visual Studio with
        # vswhere, call vcvarsall.bat, keep the result - packaged as a step (the
        # vswhere wrapper Node ships, tools/msvs/vswhere_usability_wrapper.cmd, is by
        # the same author as this action). It exports the developer environment -
        # PATH, INCLUDE, LIB, VSINSTALLDIR, VisualStudioVersion, WindowsSdkDir - to
        # every later step, which a bash step cannot do by itself.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          # arm64 Node is cross-built from an x64 host, which is what vcvarsall's
          # amd64_arm64 is for.
          arch: ${{ matrix.entry.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Rust toolchain for Temporal
        # Temporal (the JS API) is built from deps/crates with cargo, and Node enables
        # it by default; a runner without Rust would otherwise produce a bundle without
        # it after a one-line warning. prepare_node_build.sh refuses that, so all this
        # step has to do is show what is installed and, for a cross build, make the
        # target's standard library available. The static library cargo produces is
        # compiled, not linked, so cargo needs no linker for the target - just
        # `rustup target add`.
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          target="${{ matrix.entry.cargo_target }}"
          if [ -n "$target" ]; then
            rustup target add "$target"
            echo "CARGO_BUILD_TARGET=$target" >> "$GITHUB_ENV"
            echo "cross build: cargo will build Temporal for $target"
          else
            echo "native build: cargo uses the host target ($(rustc -vV | awk '/^host:/{print $2}'))"
          fi

      - name: Toolchain
        # Runs on the image's bash; this step installs the newer bash the rest of the
        # job then uses, so it has to stay compatible with 3.2.
        shell: bash
        run: |
          set -euo pipefail
          case "$NODE_PLATFORM" in
            linux)
              # Node 26 needs GCC >= 13.2 or Clang >= 19.1 - but that is only half
              # the requirement: the C++ standard library headers have to come from
              # the same generation, because V8 14.x uses C++20 library pieces that
              # libstdc++ 12 has in an incomplete form (its std::atomic_ref has no
              # deduction guide, and cppgc relies on CTAD there). A clang from a
              # newer generation paired with libstdc++ 12 headers fails somewhere
              # around src/heap/cppgc, which is 30 minutes into the build.
              # So name the compiler explicitly and check the pair before starting.
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ninja-build xz-utils gcc-13 g++-13
              {
                echo "CC=gcc-13"
                echo "CXX=g++-13"
              } >> "$GITHUB_ENV"
              echo "image defaults: $(cc --version | head -1) / $(c++ --version | head -1)"
              echo "pinned to:      $(gcc-13 --version | head -1) / $(g++-13 --version | head -1)"

              # The standard library this compiler will actually include, which is
              # not the same thing as the compiler's own version.
              read -r stdlib_major stdlib_minor < <(echo | g++-13 -dM -E -x c++ - \
                | awk '/#define __GNUC__ /{g=$3} /#define __GNUC_MINOR__ /{m=$3} END{print g, m}')
              echo "libstdc++ headers in use: ${stdlib_major}.${stdlib_minor}"
              if [ "$stdlib_major" -lt 13 ]; then
                echo "libstdc++ ${stdlib_major}.${stdlib_minor} is too old for V8 14.x; install gcc-13/g++-13"
                exit 1
              fi
              ;;
            macos)
              # Node 26 needs Xcode >= 16.4 (Apple LLVM >= 19). Print the version
              # so a failure says whether the image is behind.
              xcodebuild -version
              ninja --version
              # The image guarantees only /bin/bash 3.2. Homebrew's bash (5.x, and not
              # a keg-only formula) is what these scripts are written for.
              brew install bash
              # The runner starts a step with whatever `bash` resolves to on PATH
              # (actions/runner ScriptHandler.cs: WhichUtil.Which("bash")), so putting
              # this directory in front is enough: no per-step shell string, and inner
              # `bash Scripts/x.sh` calls get the same interpreter. Prepended explicitly
              # rather than relying on the image's PATH order. `brew --prefix bash` is
              # correct on both Apple Silicon and Intel images.
              BASH_DIR="$(brew --prefix bash)/bin"
              if [ ! -x "$BASH_DIR/bash" ]; then
                echo "brew --prefix bash points at $BASH_DIR, which has no bash in it."
                echo "brew --prefix is $(brew --prefix)."
                exit 1
              fi
              echo "$BASH_DIR" >> "$GITHUB_PATH"
              export PATH="$BASH_DIR:$PATH"
              "$BASH_DIR/bash" --version | head -1
              echo "later steps resolve bash to: $(command -v bash)"

              # A macOS arch that is not the runner's is a cross build, and the compiler
              # has to be told which architecture to emit. gyp deliberately leaves -arch
              # out of the flags when it is cross-compiling (xcode_emulation.GetLdflags
              # skips it under `if not CrossCompileRequested()`), expecting the toolchain
              # to carry it, so without this the compile lines name no architecture at
              # all: the x86_64 build then compiles deps/zlib's SSE2 file for arm64 and
              # emmintrin.h stops it with "This header is only meant to be used on x86
              # and x64 architecture". Wrappers are the only way in, because gyp takes
              # the target compiler as one program path (CC_target), not as a path plus
              # flags - the same reason the iOS entry writes wrappers.
              host_arch="$(uname -m)"
              [ "$host_arch" = aarch64 ] && host_arch=arm64
              if [ "$NODE_ARCH" != "$host_arch" ]; then
                xc_bin="$RUNNER_TEMP/node-mac-bin"
                mkdir -p "$xc_bin"
                printf '#!/bin/sh\nexec xcrun --sdk macosx clang -arch %s "$@"\n' "$NODE_ARCH" > "$xc_bin/cc"
                printf '#!/bin/sh\nexec xcrun --sdk macosx clang++ -arch %s "$@"\n' "$NODE_ARCH" > "$xc_bin/cxx"
                chmod +x "$xc_bin"/*
                {
                  echo "CC_target=$xc_bin/cc"
                  echo "CXX_target=$xc_bin/cxx"
                  # The host toolset (mksnapshot, torque, the other programs the build
                  # runs on the runner itself) has to be compiled by the runner's own
                  # compiler. gyp looks only at CC_host/CXX_host for it and otherwise
                  # reuses the target compiler (generator/ninja.py: `if not cc_host:
                  # cc_host = cc`), which would build those programs as $NODE_ARCH and
                  # then be unable to run them: the arm64 sources the build picks for
                  # the host toolset would be handed to an x86_64 compiler.
                  echo "CC_host=cc"
                  echo "CXX_host=c++"
                  # The bundle check compiles its probe with the target compiler, so the
                  # probe comes out as $NODE_ARCH like everything else in the bundle.
                  echo "NODE_VERIFY_CXX=$xc_bin/cxx"
                } >> "$GITHUB_ENV"
                echo "cross build $host_arch -> $NODE_ARCH: $(cat "$xc_bin/cxx")"

                # Running the probe needs Rosetta on an arm64 runner. Check now rather
                # than after a 30-minute build: without it the check stops at the link,
                # which still proves the archives are complete and in the order link.txt
                # gives them.
                if /usr/bin/arch -"$NODE_ARCH" /usr/bin/true 2>/dev/null; then
                  echo "the runner can run $NODE_ARCH binaries, the bundle check will run them"
                else
                  echo "NODE_VERIFY_LINK_ONLY=1" >> "$GITHUB_ENV"
                  echo "the runner cannot run $NODE_ARCH binaries (no Rosetta):"
                  echo "  the bundle check will stop after the link"
                fi
              fi
              ;;
            windows)
              # From Node 24 on, Windows is built with clang-cl, which is an
              # optional Visual Studio component. Fail here with the component
              # names rather than deep inside configure.
              clang-cl --version || {
                echo "clang-cl is not on PATH. The runner image needs the Visual"
                echo "Studio optional components"
                echo "  Microsoft.VisualStudio.Component.VC.Llvm.Clang"
                echo "  Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset"
                exit 1
              }
              # ./configure takes the LLVM version as --clang-cl's value: a bare
              # --clang-cl stops with "argument --clang-cl: expected one argument".
              # Node's own vcbuild.bat reads the version out of the installed LLVM
              # toolset and passes --clang-cl=<version>, so do the same and let the
              # build step add it to the arguments; the value also feeds gyp's
              # llvm_version and the major is used to find clang_rt.profile.
              clang_cl_version="$(clang-cl --version | head -1 | awk '{print $3}')"
              case "$clang_cl_version" in
                [0-9]*)
                  echo "NODE_CLANG_CL_VERSION=$clang_cl_version" >> "$GITHUB_ENV"
                  echo "clang-cl $clang_cl_version"
                  ;;
                *)
                  echo "cannot read a version out of clang-cl --version"
                  exit 1
                  ;;
              esac

              # The version alone does not make ninja compile with clang-cl.
              # ./configure --clang-cl records the toolchain in the generated config;
              # choosing the compiler is gyp's job, and its ninja generator looks cl.exe
              # up through the Visual Studio environment. The only thing gyp lets you
              # hand another compiler to is a make_global_settings CC entry, and gyp
              # requires that entry in every .gyp file of the build, so Node cannot carry
              # it - see patches/godotjs-gyp-win-clang-cl.patch, which adds a hook reading
              # GODOTJS_NODE_CLANG_CL. The path goes in as an environment variable rather
              # than a configure argument because it usually contains spaces.
              # clang-cl can only be handed to gyp when the runner builds for its own
              # architecture. A cross build would additionally need
              # --target=aarch64-windows-msvc, and gyp's clang-cl hook only appends
              # -m32/-m64, so a cross entry stays on cl.exe (and Node 24+ does not
              # support cl.exe at all) - see the removal note in the matrix.
              win_host_arch="$(uname -m)"
              [ "$win_host_arch" = aarch64 ] && win_host_arch=arm64
              if [ "$NODE_ARCH" = "$win_host_arch" ]; then
                clang_cl_path="$(command -v clang-cl)"
                # ninja needs the Windows spelling, and Git Bash may report either one.
                if command -v cygpath >/dev/null 2>&1; then
                  clang_cl_path="$(cygpath -w "$clang_cl_path")"
                fi
                case "$(printf '%s' "$clang_cl_path" | tr '[:upper:]' '[:lower:]')" in
                  *clang-cl.exe) clang_cl_path="${clang_cl_path%????}" ;;
                esac
                # gyp decides "is this clang-cl?" by that suffix, so a value that does
                # not end in clang-cl leaves the build on cl.exe silently. A space in the
                # path is fine (LLVM installs to C:\Program Files\LLVM\bin): gyp quotes
                # the value the same way it quotes the cl.exe path it finds itself.
                case "$clang_cl_path" in
                  *clang-cl) ;;
                  *)
                    echo "clang-cl was found at a value gyp will not accept:"
                    echo "  $clang_cl_path"
                    echo "  it has to end in clang-cl, otherwise gyp keeps using cl.exe"
                    echo "  and says nothing about it."
                    exit 1
                    ;;
                esac
                echo "GODOTJS_NODE_CLANG_CL=$clang_cl_path" >> "$GITHUB_ENV"
                echo "ninja will compile with: $clang_cl_path"
              else
                echo "arch $NODE_ARCH is not the runner's arch ($win_host_arch): clang-cl"
                echo "  would also need --target=aarch64-windows-msvc, and gyp gives the"
                echo "  host toolset the same architecture as the target, so a cross"
                echo "  Windows build cannot work here (see the note in the matrix)."
              fi

              # gyp's ninja generator works out which Visual Studio to use by reading
              # the registry, and on a runner that answer can come back empty even
              # though Visual Studio is installed - configure then stops with
              # "Could not locate Visual Studio installation." before compiling
              # anything. clang-cl does not get around it: the headers, import
              # libraries and Windows SDK still come from Visual Studio, and gyp is
              # the one that runs vcvarsall.bat for every compile rule. So the path is
              # handed to gyp instead (GYP_MSVS_OVERRIDE_PATH makes it skip the probe).
              # V8's own build does exactly this: build/vs_toolchain.py and
              # build/toolchain/win/setup_toolchain.py set GYP_MSVS_OVERRIDE_PATH
              # themselves, because a VS 2017-or-newer install location is officially
              # meant to be found through COM/vswhere rather than the registry.
              # The developer environment step located Visual Studio with vswhere and
              # ran vcvarsall.bat already, so the answer is in the job's environment:
              # VSINSTALLDIR is the install root, VisualStudioVersion the major. That
              # pair is handed to gyp because gyp cannot look it up itself - the copy
              # vendored in Node (tools/gyp/pylib/gyp/MSVSVersion.py) has no vswhere
              # support, only the registry probe and this override - and vcbuild.bat
              # sets the same GYP_MSVS_VERSION after its own vcvarsall call.
              if [ -z "${VSINSTALLDIR:-}" ]; then
                echo "The developer environment step exported no VSINSTALLDIR, so"
                echo "vswhere found no Visual Studio with a C++ toolchain on this image."
                exit 1
              fi
              vs_path="${VSINSTALLDIR%\\}"
              case "${VisualStudioVersion:-}" in
                15.*) vs_name=2017 ;;
                16.*) vs_name=2019 ;;
                17.*) vs_name=2022 ;;
                18.*) vs_name=2026 ;;
                "")
                  echo "VisualStudioVersion is not set (VSINSTALLDIR=$VSINSTALLDIR)."
                  exit 1
                  ;;
                *)
                  echo "no GYP_MSVS_VERSION mapping for VisualStudioVersion"
                  echo "${VisualStudioVersion}; add it to the case above."
                  exit 1
                  ;;
              esac
              {
                echo "GYP_MSVS_OVERRIDE_PATH=$vs_path"
                echo "GYP_MSVS_VERSION=$vs_name"
              } >> "$GITHUB_ENV"
              echo "gyp will use $vs_name at $vs_path"

              # OpenSSL's assembler. configure only asks for nasm on x86/x64, and
              # when it finds none it prints a warning and quietly builds OpenSSL
              # without asm (configure.py turns a missing nasm into openssl_no_asm=1),
              # which leaves this bundle different from Node's own Windows build and
              # the log says nothing more than WARNING. So install it and refuse to
              # continue if it still cannot be run.
              case "$NODE_ARCH" in
                x86_64)
                  if command -v nasm >/dev/null 2>&1; then
                    nasm -v
                  else
                    choco install nasm -y --no-progress
                    echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
                    "/c/Program Files/NASM/nasm.exe" -v || {
                      echo "nasm installed but is not runnable from /c/Program Files/NASM."
                      exit 1
                    }
                  fi
                  ;;
                *)
                  echo "nasm is only consulted for x86 and x64; skipping for $NODE_ARCH"
                  ;;
              esac
              ;;
            android)
              # gyp reads the cross toolchain from CC_target/CXX_target/AR_target/
              # NM_target/READELF_target, and the NDK wrapper compilers already have
              # the target and API level in their file names, so those variables are
              # all configure needs. prepare_node_build.sh repeats the check and
              # explains the same thing if a variable is missing.
              ndk="${NODE_ANDROID_NDK:-${ANDROID_NDK_LATEST_HOME:-}}"
              if [ -z "$ndk" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
                newest="$(ls -1 "${ANDROID_HOME}/ndk" | sort -V | tail -1)"
                ndk="${ANDROID_HOME}/ndk/${newest}"
              fi
              if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
                echo "No Android NDK. Set NODE_ANDROID_NDK, or let the image provide"
                echo "ANDROID_NDK_LATEST_HOME, or install one with:"
                echo "  sdkmanager --install 'ndk;28.2.13676358'"
                exit 1
              fi
              case "$(uname -s)" in
                Linux) host_tag=linux-x86_64 ;;
                Darwin) host_tag=darwin-x86_64 ;;
                *) echo "unsupported NDK host: $(uname -s)"; exit 1 ;;
              esac
              ndk_bin="$ndk/toolchains/llvm/prebuilt/$host_tag/bin"
              case "$NODE_ARCH" in
                arm64) triple="aarch64-linux-android$NODE_ANDROID_API" ;;
                arm32) triple="armv7a-linux-androideabi$NODE_ANDROID_API" ;;
                x86_64) triple="x86_64-linux-android$NODE_ANDROID_API" ;;
                *) echo "no Android triple for arch $NODE_ARCH"; exit 1 ;;
              esac
              for tool in "${triple}-clang" "${triple}-clang++" llvm-ar llvm-nm llvm-readelf; do
                if [ ! -x "$ndk_bin/$tool" ]; then
                  echo "NDK tool is missing: $ndk_bin/$tool"
                  exit 1
                fi
              done
              {
                echo "CC_target=$ndk_bin/${triple}-clang"
                echo "CXX_target=$ndk_bin/${triple}-clang++"
                echo "AR_target=$ndk_bin/llvm-ar"
                echo "NM_target=$ndk_bin/llvm-nm"
                echo "READELF_target=$ndk_bin/llvm-readelf"
                # The host toolset has to stay on the runner's compiler, or mksnapshot
                # and torque are built as the Android architecture and cannot be run
                # during the build (gyp reuses the target compiler unless CC_host and
                # CXX_host say otherwise). Same for iOS below.
                echo "CC_host=cc"
                echo "CXX_host=c++"
                # The bundle cannot be executed here, so the check stops after the
                # link. That still proves the archives are complete and in the order
                # link.txt claims.
                echo "NODE_VERIFY_CXX=$ndk_bin/${triple}-clang++"
                echo "NODE_VERIFY_LINK_ONLY=1"
              } >> "$GITHUB_ENV"
              echo "NDK $ndk, API $NODE_ANDROID_API, triple $triple"
              "$ndk_bin/${triple}-clang++" --version | head -1
              ;;
            ios)
              # gyp has no "ios" flavour, so Node would otherwise keep using the host
              # toolchain and produce macOS objects. There is no wrapper compiler for
              # iPhoneOS the way the NDK has one, and a compiler flag cannot be passed
              # through CC_target as a bare string, so write tiny wrappers that bake in
              # the triple and the SDK path.
              deployment="${NODE_IOS_DEPLOYMENT:-16.0}"
              sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
              xc_bin="$RUNNER_TEMP/node-xc-bin"
              mkdir -p "$xc_bin"
              printf '#!/bin/sh\nexec xcrun --sdk iphoneos clang -target arm64-apple-ios%s -isysroot "%s" "$@"\n' "$deployment" "$sdk_path" > "$xc_bin/cc"
              printf '#!/bin/sh\nexec xcrun --sdk iphoneos clang++ -target arm64-apple-ios%s -isysroot "%s" "$@"\n' "$deployment" "$sdk_path" > "$xc_bin/cxx"
              for tool in ar nm; do
                printf '#!/bin/sh\nexec xcrun --sdk iphoneos %s "$@"\n' "$tool" > "$xc_bin/$tool"
              done
              chmod +x "$xc_bin"/*
              {
                echo "CC_target=$xc_bin/cc"
                echo "CXX_target=$xc_bin/cxx"
                echo "AR_target=$xc_bin/ar"
                echo "NM_target=$xc_bin/nm"
                # Host tools stay on the macOS compiler of the runner (see the macOS
                # cross note above): torque and mksnapshot have to run here.
                echo "CC_host=cc"
                echo "CXX_host=c++"
                # No READELF_target: the Xcode toolchain has no readelf, and a static
                # build does not reach the rules that would call it.
                echo "NODE_VERIFY_CXX=$xc_bin/cxx"
                echo "NODE_VERIFY_LINK_ONLY=1"
                # What a consumer has to link besides the archives; gode's CMakeLists
                # uses -framework Foundation for its iOS libnode.
                echo "NODE_VERIFY_EXTRA_LINK=-framework Foundation"
              } >> "$GITHUB_ENV"
              echo "iOS deployment target $deployment, SDK $sdk_path"
              "$xc_bin/cxx" --version | head -1
              ;;
          esac

      - name: Fetch Node source
        run: |
          set -euo pipefail
          # --retry because nodejs.org sits behind a CDN that occasionally answers a
          # single request with a 503 or a truncated body; one of those would
          # otherwise throw away a whole build.
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -o node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.xz"

          # The published SHA-256, from SHASUMS256.txt next to the tarball. Without
          # this a damaged archive fails an hour later as a compile error in a file
          # that has nothing to do with the download. The detached .asc signature is
          # not checked: that needs Node's release signing keys, and the runner does
          # not have them.
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -o SHASUMS256.txt "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          expected="$(awk -v f="node-v${NODE_VERSION}.tar.xz" '$2==f{print $1; exit}' SHASUMS256.txt)"
          if [ -z "$expected" ]; then
            echo "SHASUMS256.txt has no line for node-v${NODE_VERSION}.tar.xz" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum node.tar.xz | awk '{print $1}')"
          else
            actual="$(shasum -a 256 node.tar.xz | awk '{print $1}')"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "node.tar.xz sha256 does not match the published value" >&2
            echo "  published $expected" >&2
            echo "  downloaded $actual" >&2
            exit 1
          fi
          echo "node-v${NODE_VERSION}.tar.xz sha256 verified ($actual)"

          tar -xf node.tar.xz
          mv "node-v${NODE_VERSION}" node
          df -h . || true

      - name: Build Node
        run: |
          set -euo pipefail
          cd node
          cp "../Scripts/$ARGS_FILE" args.txt
          bash ../Scripts/prepare_node_build.sh . args.txt "$NODE_VERSION"

          # Set by the Toolchain step on Windows only. The version belongs to the
          # machine, not to a tracked file, so it is added here.
          if [ -n "${NODE_CLANG_CL_VERSION:-}" ]; then
            printf -- '--clang-cl=%s\n' "$NODE_CLANG_CL_VERSION" >> args.txt
          fi

          # Windows only, and only when the runner builds for its own architecture
          # (see the toolchain step): the path that makes ninja use clang-cl is carried
          # in GODOTJS_NODE_CLANG_CL, because it usually contains spaces.
          if [ "$NODE_PLATFORM" = windows ]; then
            # Neither compiler gets a C++ standard from Node's build under ninja:
            # common.gypi puts it in msvs_settings' LanguageStandard when clang-cl is
            # requested, and gyp marks that property MSBuild-only, so the ninja
            # generator drops it. The compile line then carries no standard at all and
            # the compiler's own default decides: cl.exe is C++14, which is what made
            # ICU's headers fail to parse; clang-cl defaults to gnu++17, still short of
            # the C++20 Node and V8 need. gyp's ninja generator reads CXXFLAGS (and
            # CXXFLAGS_host for build-time tools) while writing the ninja files, which
            # is where the flag belongs. Spelling matters: clang-cl ignores -std=c++20
            # without complaining and honours /std:c++20.
            export CXXFLAGS="/std:c++20"
            export CXXFLAGS_host="/std:c++20"
            echo "CXXFLAGS for gyp: $CXXFLAGS"
          fi

          # One argument per line, comments dropped. Same rule as the args files.
          # Written as a read loop because the macOS runner's /bin/bash is 3.2 and
          # has no mapfile (that step failed with "mapfile: command not found").
          NODE_ARGS=()
          while IFS= read -r node_arg; do
            NODE_ARGS+=("$node_arg")
          done < <(grep -vE '^[[:space:]]*(#|$)' args.txt)
          printf 'configure %s\n' "${NODE_ARGS[*]}"
          python3 ./configure "${NODE_ARGS[@]}"

          # Windows only: check how the generated build files ask for the precompiled
          # header. clang-cl compares the /Yc and /Yu header names as strings and drops
          # both flags when they differ, so no .pch gets written and every later compile
          # of that target reports "unable to read PCH file ... no such file or
          # directory" - about 200 compiles and a minute later, with the real cause not
          # mentioned anywhere. patches/godotjs-gyp-win-pch-path.patch is supposed to
          # make the generator produce matching spellings; this checks that it did, and
          # repairs and names anything that does not, so the log says which file and
          # which flag instead of leaving it to the compiler two thousand targets later.
          # This step runs inside the node source directory, and the repository was
          # checked out into ./Scripts next to it, so the script is reached the same way
          # as ../Scripts/prepare_node_build.sh above.
          if [ "$NODE_PLATFORM" = windows ]; then
            python3 ../Scripts/tools/fix_windows_pch_flags.py out/Release
          fi

          # /WHOLEARCHIVE:<lib> is how MSVC is told to keep everything in a static
          # library, and node.gyp names those libraries where MSBuild writes them. Under
          # ninja they are written under obj/ instead, so the first link that reaches one
          # of them stops with "LNK1356: cannot find library `lib/zlib.lib'" - which, at
          # [4222/4233], costs half an hour of compiling to find out. This reads the
          # generated ninja files instead and prints every flag that names a library no
          # build step produces. patches/godotjs-node-win-ninja-wholearchive-obj-paths.patch
          # is what makes it pass.
          if [ "$NODE_PLATFORM" = windows ]; then
            python3 ../Scripts/tools/check_wholearchive_paths.py out/Release
          fi

          # Torque writes the headers V8's own headers depend on, as one build step
          # among thousands. Two things happen here:
          #
          #   * those files are generated on their own first and each one's size is
          #     checked, so a generator that writes nothing fails in about a minute
          #     and prints the command that writes the file, how long that command
          #     line is, and what the generator did write. On Windows this caught a
          #     generator that reported success while leaving
          #     src/objects/torque-defined-classes-tq.inc at 0 bytes, which turned
          #     into 13 "incomplete type" errors half an hour later; why that
          #     happens is written up in prepare_node_build.sh and it is fixed by
          #     patches/godotjs-torque-path-separator.patch.
          #   * generating them here also means no compile can read one while torque
          #     still has it open.
          # The expected line counts are what a complete build produces; only the
          # order of magnitude matters, so half of that is the floor.
          set -o pipefail
          for torque_output in \
            "gen/torque-generated/src/objects/torque-defined-classes-tq.inc 600" \
            "gen/torque-generated/objects-body-descriptors-inl.inc 120" \
            "gen/torque-generated/class-forward-declarations.h 180" \
            "gen/torque-generated/instance-types.h 600"; do
            set -- $torque_output
            if ! (cd out/Release && ninja -t query "$1" >/dev/null 2>&1); then
              # A cross build may not accept a generated file as a target of its own.
              # The build below generates it anyway, so only the ordering and this
              # size check are lost - say so instead of failing a working build.
              echo "note: $1 cannot be generated on its own here; the build does it as usual"
              continue
            fi
            ninja_rc=0
            ninja -C out/Release "$1" || ninja_rc=$?
            # On an empty file "grep -c''" prints 0 and exits 1, so the count is
            # taken in a form that cannot end the step on its own; -1 means the
            # generator did not create the file at all.
            if [ -f "out/Release/$1" ]; then
              torque_lines="$(grep -c '' "out/Release/$1" 2>/dev/null || true)"
              torque_lines="${torque_lines:-0}"
            else
              torque_lines=-1
            fi
            echo "generated $1: $torque_lines lines (ninja exit $ninja_rc)"
            if [ "$ninja_rc" -ne 0 ] || [ "$torque_lines" -lt "$2" ]; then
              if [ "x$torque_lines" = "x-1" ]; then
                echo "--- the generator did not create $1 at all ---"
              else
                echo "--- $1 has $torque_lines lines; a complete run writes about $2 ---"
              fi
              echo "command that writes it:"
              (cd out/Release && ninja -t commands "$1" 2>/dev/null | tail -1)
              echo "length of that command line (cmd.exe gives up around 8100):"
              (cd out/Release && ninja -t commands "$1" 2>/dev/null | tail -1 | wc -c)
              echo "what the generator wrote:"
              ls -l out/Release/gen/torque-generated 2>/dev/null | head -25
              ls -l out/Release/gen/torque-generated/src/objects 2>/dev/null | head -25
              echo "every copy of this file under the source tree:"
              find . -name "$(basename "$1")" -exec ls -l {} + 2>/dev/null | head
              exit 1
            fi
          done

          # Build, keeping the log so a failure can be described without running the
          # whole build again: on a Windows runner a rerun costs about half an hour.
          # The log lives next to the build, not in $RUNNER_TEMP: on the Windows
          # runner the GitHub variables hold backslash paths (D:\a\_temp), and a
          # backslash inside a bash double-quoted string is not a separator, so the
          # file could not be created at all and the report below printed nothing.
          #
          # Before the long build: the two things the later steps need that need
          # nothing from it. Both take seconds, and finding either after 40 minutes
          # of compiling costs a whole round.
          #   * the commands the later steps call by name have to exist on this
          #     runner (everything is reported at once, and sha256sum is deliberately
          #     not on the list because macOS runners have no coreutils)
          #   * the header install that packaging does, which reads config.gypi and
          #     is where an installer or option change shows up
          missing_tools=()
          for tool in python3 find tr du awk sed grep tar gzip gh; do
            command -v "$tool" > /dev/null 2>&1 || missing_tools+=("$tool")
          done
          if [ "${#missing_tools[@]}" -ne 0 ]; then
            echo "these commands are needed by the later steps and are not on PATH:" >&2
            printf '  %s\n' "${missing_tools[@]}" >&2
            exit 1
          fi
          header_check="$PWD/.headers-check"
          rm -rf "$header_check"
          bash ../Scripts/tools/install_node_headers.sh . out/Release \
            "$header_check/node" "$NODE_PLATFORM" "$NODE_ARCH"
          rm -rf "$header_check"

          ninja_log="$PWD/.ninja-build.log"
          # -k 20 keeps going after the first failure. Failures in independent
          # libraries (one archive, one link) are worth seeing in the same run: a
          # Windows round costs about 40 minutes, and stopping at the first one means
          # one bug discovered per round. The report below still starts from the
          # earliest FAILED line.
          if ninja -C out/Release -k 20 node 2>&1 | tee "$ninja_log"; then
            :
          else
            # Printed plainly rather than inside a ::group::, because a collapsed
            # group hides exactly the lines that matter. Nothing in here may cut the
            # report short, so errexit stays off for its duration.
            set +e
            echo "=== build failed: the facts that decide what to do next ==="
            echo "--- generator output an embedder header needs ---"
            tq=out/Release/gen/torque-generated/src/objects/torque-defined-classes-tq.inc
            if [ -f "$tq" ]; then
              echo "$tq: $(grep -c '' "$tq") lines, $(grep -c '^class ' "$tq") class definitions"
              grep -m3 '^class ' "$tq"
            else
              echo "$tq was not produced"
            fi
            echo "--- compiler that was used ---"
            grep -m1 -E '(clang-cl|cl)\.exe' "$ninja_log" || echo "(no compiler line in the log)"
            failed_line=$(grep -m1 '^FAILED:' "$ninja_log")
            # "FAILED: [code=1] <target> [more targets...]" - the first target is the
            # one worth looking at. Older ninja prints "FAILED: <target>".
            failed_target=${failed_line#*'] '}
            if [ "$failed_target" = "$failed_line" ]; then
              failed_target=${failed_line#*: }
            fi
            failed_target=${failed_target%% *}
            if [ -n "$failed_target" ]; then
              echo "--- first failed target: $failed_target ---"
              (cd out/Release && ninja -t commands "$failed_target" 2>/dev/null | tail -1)
              # What the failing compile waits for: if no torque stamp appears here,
              # the compile is not ordered after the generator that writes its inputs.
              (cd out/Release && ninja -t query "$failed_target" 2>/dev/null | head -25)
              # The response file ninja wrote holds the include path list that the
              # compiler actually saw; MSVC reads it through @file on the line.
              # On Windows that @file is not a word of its own - it sits inside the
              # quoted argument handed to gyp-win-tool - so read it out of the line
              # rather than by splitting the line into words.
              rsp_token=$(cd out/Release && ninja -t commands "$failed_target" 2>/dev/null \
                | tail -1 | grep -oE '@[^ "@]+\.rsp' | head -1 | tr -d '@')
              if [ -n "$rsp_token" ] && [ -f "out/Release/$rsp_token" ]; then
                echo "include path in out/Release/$rsp_token:"
                # gyp writes -I even for MSVC, and clang-cl takes both spellings.
                tr ' ' '\n' < "out/Release/$rsp_token" | grep -E '^[-/](I|external:I)' | head -30
              fi
            fi
            exit 1
          fi

          # No object cleanup here, on purpose. On Linux Node's .a files are thin
          # archives: they store the paths of their object files rather than their
          # contents, so the package step has to read those .o files to build the fat
          # archives that go into the bundle. Deleting them before Package makes ar
          # fail with the archive's own name:
          #   ar: .../out/Release/obj/libnode_base.a: No such file or directory
          # The cleanup is a separate step, run after the bundle is verified.
          du -sh out/Release || true
          df -h . || true

          # Smoke test the binary the archives came from - but only when it was
          # built for the machine running the job. A cross-built node cannot be
          # executed here, so the bundle check below is the only gate for those.
          if [ "$NODE_PLATFORM" = windows ]; then
            NODE_BIN=out/Release/node.exe
          else
            NODE_BIN=out/Release/node
          fi
          if [ "$NODE_PLATFORM" = android ] || [ "$NODE_PLATFORM" = ios ]; then
            echo "cross build for $NODE_PLATFORM/$NODE_ARCH: skipping the host smoke test"
            ls -l out/Release/libnode.a out/Release/libv8_base_without_compiler.a
          else
          "$NODE_BIN" -p 'process.versions.v8 + " icu=" + process.versions.icu'
          "$NODE_BIN" -e '
            const assert = require("node:assert");
            assert.ok(new Intl.Collator("zh").compare("\u7532", "\u4e59") !== 0);
            assert.strictEqual(new Intl.NumberFormat("en-US").format(1234.5), "1,234.5");
            assert.strictEqual(require("node:crypto").createHash("sha256").update("x").digest("hex").length, 64);
            assert.strictEqual(/\p{Script=Han}/u.test("\u4e2d"), true);
            console.log("node smoke ok");
          '
          fi

      - name: Check the assembled OpenSSL objects reached the library
        # Runs even when the build failed, because "is the archive complete?" is the
        # first thing to know.
        #
        # On Windows OpenSSL's hand-written assembly (nasm syntax .asm) is built by a
        # gyp rule, and in a ninja file a rule's output only joins the target's
        # objects when the rule says process_outputs_as_sources - Node's rules do not
        # say it, so every .asm was assembled into a loose .obj that no archive ever
        # contained. That looks healthy for 2000 targets and then fails at link time
        # with unresolved symbols that only those files define (OPENSSL_cleanse,
        # aesni_encrypt, OPENSSL_ia32cap_P, ...). Reading the archive's member list
        # answers the question directly, however far the build got.
        # See patches/godotjs-openssl-win-asm-outputs-as-sources.patch.
        if: always()
        run: |
          # This step gates one thing: whether the nasm-built objects ended up inside
          # openssl.lib. When the build did not get far enough to answer that, it
          # reports and passes - there is nothing to gate on yet.
          set +e
          [ "$NODE_PLATFORM" = windows ] || exit 0
          [ "$NODE_ARCH" = x86_64 ] || { echo "no nasm-built assembly for $NODE_ARCH"; exit 0; }
          # This step runs in the repository directory; the build itself cd's into node/.
          ossl=node/out/Release/obj/deps/openssl/openssl.lib
          if [ ! -f "$ossl" ]; then
            echo "$ossl was not produced; the build did not get that far"
            exit 0
          fi
          # lib.exe writes its options with a leading slash (/NOLOGO, /LIST), and the
          # bash on the Windows runners rewrites an argument that starts with / into a
          # path under its own install directory, so lib.exe was asked to open
          # "C:\Program Files\Git\NOLOGO". MSYS2_ARG_CONV_EXCL tells that bash to leave
          # the arguments as written; other shells ignore the variable.
          libexe=lib.exe
          command -v lib.exe > /dev/null 2>&1 || libexe="${VCToolsInstallDir}bin/HostX64/x64/lib.exe"
          members="$PWD/.openssl-lib-members.txt"
          MSYS2_ARG_CONV_EXCL='*' "$libexe" /NOLOGO /LIST "$ossl" > "$members" 2>&1
          listed="$(grep -c '\.obj' "$members" 2>/dev/null || true)"
          if [ "${listed:-0}" = 0 ]; then
            # Without a member list nothing below can be concluded, and a guard that
            # quietly does nothing is worse than no guard: it reads as a pass.
            echo "lib.exe produced no member list for $ossl; its output was:"
            head -8 "$members"
            exit 1
          fi
          # The member pattern starts with a dash, so it goes after -e or grep reads it
          # as its own options.
          asm_members="$(grep -c -e '-x86_64\.obj' "$members" 2>/dev/null || true)"
          echo "members in openssl.lib: ${listed}, of which ${asm_members:-0} carry the nasm"
          echo "object naming (-x86_64.obj); the ones that must be present are named below"
          if [ "${asm_members:-0}" = 0 ]; then
            echo "the archive has ${listed} members and none of them were assembled from"
            echo ".asm, so anything linking openssl.lib is missing their symbols. Check"
            echo "that patches/godotjs-openssl-win-asm-outputs-as-sources.patch applied"
            echo "(the Build log says 'applied ... openssl' near the top)."
            exit 1
          fi
          missing=0
          for asm_obj in x86_64cpuid.obj aes-x86_64.obj aesni-x86_64.obj; do
            if grep -q "$asm_obj" "$members"; then
              echo "in the archive: $asm_obj"
            else
              echo "NOT in the archive: $asm_obj"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "The nasm objects are assembled but not archived, so anything that"
            echo "links openssl.lib is missing their symbols. Check that"
            echo "patches/godotjs-openssl-win-asm-outputs-as-sources.patch applied"
            echo "(the Build log says 'applied ... openssl' near the top)."
            grep -m5 'x86_64' "$members"
            exit 1
          fi
          echo "openssl.lib carries the assembled assembly objects"

      - name: Package
        run: |
          set -euo pipefail
          # A failure here is usually "No space left on device" while copying a
          # few hundred MB of archives; these two lines make the log say so instead
          # of ending at the cp.
          df -h . || true
          cd node
          # The archive list and the --whole-archive grouping are read out of
          # out/Release/build.ninja by the script itself. args.txt is what the
          # build step configured with, and lands in manifest.json for provenance.
          NODE_CONFIG_ARGS=args.txt \
            bash ../Scripts/package_node.sh . out/Release ../staging "$NODE_PLATFORM" "$NODE_ARCH"

      - name: What came out
        # Ahead of the verification: when the link check below fails, this is the
        # evidence (bundle sizes and the whole of link.txt) that makes the failure
        # readable in the same run.
        run: |
          set -euo pipefail
          du -sh staging/node/* || true
          ls -l staging/node/*release/ | head -60
          cat staging/node/*release/link.txt

      - name: Verify the bundle
        # The probe compiles and runs on POSIX toolchains; on Windows the package
        # step is still checked, the link test is left to a local run.
        if: ${{ matrix.entry.platform != 'windows' }}
        run: bash Scripts/verify_node_bundle.sh staging

      - name: Free the object files
        # Runs after the bundle is packaged and checked: the Linux archives are thin,
        # so packaging reads the object files this step removes. This only exists to
        # keep the disk free for the artifact upload.
        run: |
          set -euo pipefail
          if [ -d node/out/Release ]; then
            find node/out/Release \( -name '*.o' -o -name '*.obj' \) -delete
          fi
          du -sh node/out/Release || true
          df -h . || true

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt_node_${{ matrix.entry.platform }}_${{ matrix.entry.arch }}
          path: staging/
          # Without this an empty staging/ uploads successfully, and the failure only
          # shows up where the bundle is consumed.
          if-no-files-found: error

      - name: Publish this platform's bundle
        # A platform publishes its own bundle as soon as its own build is done,
        # instead of waiting for the whole matrix: a green Linux build is
        # downloadable while Windows is still compiling, and a platform that fails
        # later holds up nobody. The release is created by whoever arrives first and
        # the others add their file to it. Names carry platform and architecture, so
        # a job never touches what another one published, and re-running one
        # platform replaces only its own file.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both are needed below; say so here rather than failing inside the packaging.
          command -v gh > /dev/null || { echo "gh is not on PATH on this runner" >&2; exit 1; }
          command -v python3 > /dev/null || { echo "python3 is not on PATH on this runner" >&2; exit 1; }
          tag="${RELEASE_TAG:-node-${NODE_VERSION}}"

          # Exactly the layout build_all.yml uses when it publishes every platform at
          # once, so whoever downloads the bundle can take either: node/include plus
          # node/<platform>.<arch>.release/, zipped under the same file name.
          shopt -s nullglob
          platforms=(staging/node/*.release staging/node/*_release)
          if [ "${#platforms[@]}" -ne 1 ]; then
            echo "expected one platform directory in staging/node, found ${#platforms[@]}" >&2
            printf '  %s\n' "${platforms[@]}" >&2
            exit 1
          fi
          plat_arch="$(basename "${platforms[0]}")"
          plat_arch="${plat_arch%.release}"
          plat_arch="${plat_arch%_release}"
          asset="node_${NODE_VERSION}_${plat_arch}.zip"
          # make_archive appends ".zip" itself, so it gets the name without the suffix.
          python3 -c 'import shutil, sys; shutil.make_archive(sys.argv[1][:-4], "zip", sys.argv[2], "node")' \
            "$asset" staging
          # A truncated or missing archive here would sit on the release page looking
          # fine until someone tried to link against it.
          [ -s "$asset" ] || { echo "$asset was not written" >&2; exit 1; }
          # nodejs.org ships SHASUMS256.txt next to its tarballs for the same reason
          # this does: these files are fetched over a network by whoever builds the
          # engine. One file per platform, so publishing stays race-free. python3 is
          # used because sha256sum is coreutils and macOS runners do not have it. It
          # reads in 1 MB blocks, and the list comprehension is there because a shell
          # one-liner cannot hold a for statement.
          python3 -c 'import hashlib, sys; p = sys.argv[1]; h = hashlib.sha256(); f = open(p, "rb"); [h.update(b) for b in iter(lambda: f.read(1 << 20), b"")]; print(f"{h.hexdigest()}  {p}")' \
            "$asset" | tee "$asset.sha256"
          [ -s "$asset.sha256" ] || { echo "$asset.sha256 is empty" >&2; exit 1; }
          echo "$asset: $(du -h "$asset" | cut -f1)"

          # Overwrite in place, never delete-and-recreate: this release page is shared
          # by every platform in the matrix, so recreating it would erase the bundles
          # the others already published. The description is refreshed and this
          # platform's files replace their own old copies by name.
          notes="Prebuilt Node ${NODE_VERSION} libraries for GodotJS. Each file is one platform, published by that platform's own build job as soon as it passed; a platform missing here is still building or failed."
          # gh decides which repository to talk to by looking at the git checkout it
          # is standing in, and this step is not standing in one: the repository is
          # checked out into ./Scripts while steps run from the job workspace above
          # it. Every call therefore names the repository. Without this a call that
          # could not work out the repository fails like "no such release", which is
          # what sent the step down the create path against a tag that already existed.
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" --json tagName > /dev/null 2> gh-view.err; then
            gh release edit "$tag" --repo "$repo" --title "$tag" --notes "$notes" --prerelease
          else
            # Keep the reason visible: last time this branch was taken the release did
            # exist and the message explaining why was thrown away with the stderr.
            sed 's/^/gh release view: /' gh-view.err
            # Two jobs can reach this in the same second, so losing the race to create
            # is not a failure: editing what the other one made is the same outcome.
            gh release create "$tag" \
                 --repo "$repo" \
                 --title "$tag" \
                 --notes "$notes" \
                 --target "${{ github.sha }}" \
                 --prerelease \
              || gh release edit "$tag" --repo "$repo" --title "$tag" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" --repo "$repo" "$asset" "$asset.sha256" --clobber
          echo "release $tag now carries:"
          gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name'
