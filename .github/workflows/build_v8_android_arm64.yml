name: v8-android-arm64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true # BYO

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            depot_tools-${{ runner.os }}-

      - name: Cache Android NDK r29
        uses: actions/cache@v4
        with:
          path: android-ndk-r29
          key: android-ndk-r29-${{ runner.os }}-v29

      # See https://v8.dev/docs/cross-compile-arm
      - name: Fetch v8
        run: |
          set -euo pipefail
          echo "Disk before any downloads:"
          df -h
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build generate-ninja pkg-config zip unzip ca-certificates

          cd $GITHUB_WORKSPACE
          # 提醒：下面三个 default_android_ndk_* 参数在 V8 15 里已经不是已声明的 gn 参数了，
          # gn 只会警告一句、不会生效。V8 的 Android 编译器实际用 DEPS 里 CIPD 装的
          # third_party/android_toolchain/ndk（15.7 钉的是 r30），而 android_ndk_root 在
          # build/config/android/config.gni 里是普通赋值，args.gn 改不动它。
          # 所以产物用的是 r30 的 libc++，比 Godot 4.7 要求的 r29 新一个大版本，多出的
          # std::__ndk1::__hash_memory 引用由引擎侧补符号解决：
          # GodotJS/impl/v8/jsb_libcxx_hash_compat.cpp
          if [ ! -d "$GITHUB_WORKSPACE/android-ndk-r29" ]; then
            wget -O android-ndk.zip -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip -q android-ndk.zip
          fi
          export ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r29
          echo "default_android_ndk_root = \"$GITHUB_WORKSPACE/android-ndk-r29\"" >> $GITHUB_WORKSPACE/Scripts/v8.android_arm64.args.gn
          echo "default_android_ndk_version = \"r29\"" >> $GITHUB_WORKSPACE/Scripts/v8.android_arm64.args.gn
          echo "default_android_ndk_major_version = 29" >> $GITHUB_WORKSPACE/Scripts/v8.android_arm64.args.gn
          cat $GITHUB_WORKSPACE/Scripts/v8.android_arm64.args.gn

          if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          echo "target_os = ['android']" >> .gclient
          cat .gclient
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD
          gclient sync -D --force --reset

      - name: Build v8 arm64
        run: |
          set -euo pipefail
          echo "Disk before build-deps:"
          df -h
          cd $GITHUB_WORKSPACE/v8/v8

          sh ./build/install-build-deps.sh --android

          # Clean apt caches after heavy install
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          python ./build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          python ./tools/dev/v8gen.py arm64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.android_arm64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/args.gn
          bash $GITHUB_WORKSPACE/Scripts/prepare_v8_build.sh $GITHUB_WORKSPACE/v8/v8 $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/args.gn "$V8_VERSION"
          cat $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/args.gn
          ninja -C ./out.gn/arm64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/android.arm64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/obj/libv8_monolith.a staging/v8/android.arm64.release/

          # ICU is built with its data in a separate file, so the monolith does not carry it.
          # GodotJS loads icudtl.dat at runtime (Intl.*, Date.prototype.toLocale*): next to the
          # executable, or wherever GODOTJS_ICU_DATA points.
          cp $GITHUB_WORKSPACE/v8/v8/third_party/icu/android/icudtl.dat staging/v8/android.arm64.release/
          test -f staging/v8/android.arm64.release/icudtl.dat

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_android_arm64
          path: staging/
