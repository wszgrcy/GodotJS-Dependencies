name: v8-linux-x86_64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            depot_tools-${{ runner.os }}-

      - name: Fetch v8
        run: |
          set -euo pipefail
          echo "Disk before any downloads:"
          df -h
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build generate-ninja pkg-config ca-certificates

          # The host libstdc++ has to come from GCC 14 or newer. Two separate
          # things in the source depend on it:
          #   - std::hardware_destructive_interference_size, used by a static_assert
          #     in src/heap/mutable-page.cc, is only declared from GCC 12.
          #   - std::powl, called by src/objects/js-duration-format.cc, is only
          #     declared from GCC 14. Measured on that exact call with the four
          #     compiler generations: g++-12 and g++-13 fail with "no member named
          #     'powl' in namespace 'std'", g++-14 and g++-15 compile it.
          # ubuntu-24.04 ships GCC 13 by default, so g++-14 goes in next to it and
          # clang picks up the newest GCC installation it can find (no cc/cxx
          # arguments needed). What the newer image costs is the C library floor:
          # use_sysroot=false makes the runner's glibc (2.39 here) the floor of the
          # archives, where ubuntu-22.04 gave 2.35.
          if [ "${V8_VERSION%%.*}" -ge 14 ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-14
          fi

          cd $GITHUB_WORKSPACE
          if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir -p $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD
          gclient sync -D --force --reset

      - name: Build v8 x86_64
        run: |
          set -euo pipefail
          echo "Disk before build-deps:"
          df -h
          cd $GITHUB_WORKSPACE/v8/v8

          sh ./build/install-build-deps.sh

          # Clean apt caches after heavy install
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          python ./tools/dev/v8gen.py x64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.linux_x86_64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn
          bash $GITHUB_WORKSPACE/Scripts/prepare_v8_build.sh $GITHUB_WORKSPACE/v8/v8 $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn "$V8_VERSION"
          ls -l $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/
          ninja -C ./out.gn/x64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/linux.x86_64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/obj/libv8_monolith.a staging/v8/linux.x86_64.release/

          # ICU is built with its data in a separate file, so the monolith does not carry it.
          # GodotJS loads icudtl.dat from next to the executable at runtime (Intl.*, Date.prototype.toLocale*).
          cp $GITHUB_WORKSPACE/v8/v8/third_party/icu/common/icudtl.dat staging/v8/linux.x86_64.release/
          test -f staging/v8/linux.x86_64.release/icudtl.dat

          # The headers come from this job. They are the same for every platform,
          # and unlike the Windows jobs this one can never be skipped by
          # vars.SKIP_WINDOWS, so a published bundle always has them.
          cp -r $GITHUB_WORKSPACE/v8/v8/include staging/v8/include

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_linux_x86_64
          path: staging/
