name: v8-android-x86_64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true # BYO

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            depot_tools-${{ runner.os }}-

      - name: Cache Android NDK r29
        uses: actions/cache@v4
        with:
          path: android-ndk-r29
          key: android-ndk-r29-${{ runner.os }}-v29

      - name: Fetch v8
        run: |
          set -euo pipefail
          echo "Disk before any downloads:"
          df -h
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build generate-ninja pkg-config zip unzip ca-certificates

          cd $GITHUB_WORKSPACE
          # NDK 版本必须跟引擎一致：Godot 4.7 硬要求 29.0.14206865（= r29）。
          # 用旧 NDK 编出来的静态库会引用旧 libc++ 的出库符号（如
          # std::__ndk1::__hash_memory），新 libc++ 已经不再提供，引擎链接时会报 undefined symbol。
          if [ ! -d "$GITHUB_WORKSPACE/android-ndk-r29" ]; then
            wget -O android-ndk.zip -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip -q android-ndk.zip
          fi
          export ANDROID_NDK=$GITHUB_WORKSPACE/android-ndk-r29
          echo "default_android_ndk_root = \"$GITHUB_WORKSPACE/android-ndk-r29\"" >> $GITHUB_WORKSPACE/Scripts/v8.android_x86_64.args.gn
          echo "default_android_ndk_version = \"r29\"" >> $GITHUB_WORKSPACE/Scripts/v8.android_x86_64.args.gn
          echo "default_android_ndk_major_version = 29" >> $GITHUB_WORKSPACE/Scripts/v8.android_x86_64.args.gn
          cat $GITHUB_WORKSPACE/Scripts/v8.android_x86_64.args.gn

          if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir -p $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          echo "target_os = ['android']" >> .gclient
          cat .gclient
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD
          gclient sync -D --force --reset

      - name: Build v8 x86_64
        run: |
          set -euo pipefail
          echo "Disk before build-deps:"
          df -h
          cd $GITHUB_WORKSPACE/v8/v8

          sh ./build/install-build-deps.sh --android

          # Clean apt caches after heavy install
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          python ./build/linux/sysroot_scripts/install-sysroot.py --arch=x64
          python ./tools/dev/v8gen.py x64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.android_x86_64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn
          bash $GITHUB_WORKSPACE/Scripts/prepare_v8_build.sh $GITHUB_WORKSPACE/v8/v8 $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn "$V8_VERSION"
          cat $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/args.gn
          ninja -C ./out.gn/x64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/android.x86_64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/x64.release/obj/libv8_monolith.a staging/v8/android.x86_64.release/

          # ICU is built with its data in a separate file, so the monolith does not carry it.
          # GodotJS loads icudtl.dat at runtime (Intl.*, Date.prototype.toLocale*): next to the
          # executable, or wherever GODOTJS_ICU_DATA points.
          cp $GITHUB_WORKSPACE/v8/v8/third_party/icu/android/icudtl.dat staging/v8/android.x86_64.release/
          test -f staging/v8/android.x86_64.release/icudtl.dat

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_android_x86_64
          path: staging/
