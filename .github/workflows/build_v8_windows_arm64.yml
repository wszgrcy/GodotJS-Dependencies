name: v8-windows-arm64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2022
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        if: ${{ vars.HOST_WINDOWS != 'true' }}
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Windows SDK 10.0.28000
        shell: pwsh
        run: |
          # V8 15 hard-codes the Windows SDK version it wants (build/vs_toolchain.py:
          # SDK_VERSION = '10.0.28000.0') and build/toolchain/win/setup_toolchain.py passes
          # that version to vcvarsall.bat. The windows-2022 image only ships
          # 10.0.17763/19041/22621/26100, so gn stops with 'Path "...\include\10.0.28000.0\um"
          # ... does not exist'. Installing the SDK lets us keep the image's Visual Studio 2022.
          $ErrorActionPreference = "Stop"
          if (([int](($env:V8_VERSION -split '\.')[0])) -lt 15) {
            echo "V8 $env:V8_VERSION does not need the 10.0.28000 SDK."
            exit 0
          }

          $sdk = "10.0.28000.0"
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10"
          if (Test-Path (Join-Path $kits "Include\$sdk\um")) {
            echo "Windows SDK $sdk is already installed."
            exit 0
          }

          # Official installer link for Windows SDK 10.0.28000.2270, the build named in
          # build/vs_toolchain.py: https://learn.microsoft.com/windows/apps/windows-sdk/downloads
          $setup = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
          echo "Downloading the Windows SDK $sdk installer..."
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2370315" -OutFile $setup

          # Desktop C++ headers and import libraries. gn probes the x86, x64 and arm64
          # toolchains, so all three sets of import libraries have to be present.
          $features = "OptionId.DesktopCPPx86 OptionId.DesktopCPPx64 OptionId.DesktopCPParm64"
          $log = Join-Path $env:RUNNER_TEMP "winsdksetup.log"
          $installer = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList "/quiet /norestart /features $features /l `"$log`""
          # 3010 means installed, reboot required.
          if ($installer.ExitCode -ne 0 -and $installer.ExitCode -ne 3010) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "winsdksetup.exe exited with code $($installer.ExitCode)"
          }

          # Fail here with a readable message instead of inside gn, and show what is there.
          $dirs = @("Include\$sdk\um", "Include\$sdk\ucrt", "Lib\$sdk\um\x64", "Lib\$sdk\ucrt\x64",
                    "Lib\$sdk\um\arm64", "Lib\$sdk\ucrt\arm64")
          foreach ($dir in $dirs) {
            if (-not (Test-Path (Join-Path $kits $dir))) { throw "Windows SDK $sdk is missing $dir after install" }
          }
          echo "Windows SDK $sdk installed. Import libraries:"
          Get-ChildItem (Join-Path $kits "Lib\$sdk") -Directory -Recurse -Depth 1 |
            ForEach-Object { echo "  $($_.FullName)" }
          # ninja also runs rc.exe / mt.exe / midl.exe out of bin\<sdk>\x64 (the host tools are
          # x64 even when target_cpu is arm64). Report them here instead of failing in ninja.
          foreach ($tool in "rc.exe", "mt.exe", "midl.exe") {
            $toolPath = Join-Path $kits "bin\$sdk\x64\$tool"
            if (Test-Path $toolPath) { echo "  found $toolPath" } else { echo "  MISSING $toolPath" }
          }

      - name: Fetch v8
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          echo %GITHUB_WORKSPACE%
          echo %PATH%

          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always
          git config --global core.longpaths true

          curl https://storage.googleapis.com/chrome-infra/depot_tools.zip --output ./depot_tools.zip
          7z x -odepot_tools depot_tools.zip
          set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0

          echo _____depot_tools_____
          cd depot_tools
          call gclient
          
          cd ..
          mkdir v8
          cd v8
          echo _____fetch_____
          call fetch --nohooks --nohistory v8
          echo _____enter_____
          cd v8
          echo _____checkout_____
          call git fetch origin refs/tags/%V8_VERSION%
          call git checkout FETCH_HEAD
          echo _____sync_____
          call gclient sync -D --force --reset

      - name: Build v8 arm64
        shell: cmd
        run: |
          set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          cd %GITHUB_WORKSPACE%
          cd v8
          cd v8
          set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          echo _____ninja_____ dont know why v8gen.py cant properly generate files we want
          call gn gen .\out.gn\arm64.release -args="is_component_build=false is_debug=false target_cpu=""arm64"" target_os=""win"" v8_enable_i18n_support=false v8_monolithic=true v8_use_external_startup_data=false v8_enable_pointer_compression=true v8_jitless=false use_custom_libcxx=false treat_warnings_as_errors=false v8_symbol_level=0 v8_enable_sandbox=false" || exit /b 1
          echo _____list_____
          dir .\out.gn\arm64.release
          more .\out.gn\arm64.release\args.gn
          rem V8 15 and newer default these to on, and they need Rust or libc++.
          rem gn regenerates itself because args.gn changed.
          for /f "delims=." %%v in ("%V8_VERSION%") do set V8_MAJOR=%%v
          if %V8_MAJOR% GEQ 15 (
            echo v8_enable_partition_alloc = false>> .\out.gn\arm64.release\args.gn
            echo v8_enable_temporal_support = false>> .\out.gn\arm64.release\args.gn
            echo enable_rust = false>> .\out.gn\arm64.release\args.gn
            echo v8_enable_fuzztest = false>> .\out.gn\arm64.release\args.gn
          )
          echo _____build_____
          call ninja -C .\out.gn\arm64.release v8_monolith || exit /b 1
          echo _____results_____
          dir %GITHUB_WORKSPACE%\v8\v8\out.gn\arm64.release\obj\*.lib

          cd %GITHUB_WORKSPACE%
          mkdir staging\v8\windows_arm64_release
          copy %GITHUB_WORKSPACE%\v8\v8\out.gn\arm64.release\obj\v8_monolith.lib staging\v8\windows_arm64_release\v8_monolith.lib /Y /B

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_windows_arm64
          path: staging/
