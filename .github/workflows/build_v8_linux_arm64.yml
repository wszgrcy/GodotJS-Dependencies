name: v8-linux-arm64

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'v8 version tag'
        type: string
        required: false
  workflow_call:
    inputs:
      v8_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      V8_VERSION: ${{ inputs.v8_version || github.event.inputs.v8_version }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            depot_tools-${{ runner.os }}-

      - name: Fetch v8
        run: |
          set -euo pipefail
          echo "Disk before any downloads:"
          df -h
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build generate-ninja pkg-config ca-certificates

          # V8 15 uses std::atomic_ref, which needs libstdc++ from GCC 12 or newer.
          # ubuntu-22.04 ships GCC 11. clang picks up the newest GCC installation it
          # can find, so installing g++-13 next to the default compiler is enough.
          if [ "${V8_VERSION%%.*}" -ge 15 ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-13
          fi

          # args.gn sets use_sysroot=false, so a --target=aarch64-linux-gnu compile
          # has to find an arm64 C library and libstdc++ on the runner itself. This
          # is a cross build, so the host headers do not count: without these two
          # packages clang stops at '#include <memory>' in v8config.h, and metagen
          # stops at 'bits/libc-header-start.h'. The cross libstdc++ has to be
          # GCC 12+ for the same reason the host one does, so prefer the versioned
          # package and fall back to whatever the default cross g++ provides.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libc6-dev-arm64-cross
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-13-aarch64-linux-gnu; then
            echo "installed g++-13-aarch64-linux-gnu"
          else
            echo "g++-13-aarch64-linux-gnu is not available here, using the default cross g++"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-aarch64-linux-gnu
          fi
          ls -d /usr/lib/gcc-cross/aarch64-linux-gnu/* /usr/aarch64-linux-gnu/include/c++/*

          cd $GITHUB_WORKSPACE
          if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          fi
          export PATH=$GITHUB_WORKSPACE/depot_tools:$PATH
          cd depot_tools
          gclient
          mkdir $GITHUB_WORKSPACE/v8
          cd $GITHUB_WORKSPACE/v8
          fetch --nohooks --nohistory v8
          cd v8
          git fetch origin refs/tags/${{ env.V8_VERSION }}
          git checkout FETCH_HEAD
          gclient sync -D --force --reset

      - name: Build v8 arm64
        run: |
          set -euo pipefail
          echo "Disk before build-deps:"
          df -h
          cd $GITHUB_WORKSPACE/v8/v8

          sh ./build/install-build-deps.sh

          # Clean apt caches after heavy install
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          python ./build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          python ./tools/dev/v8gen.py arm64.release
          cp $GITHUB_WORKSPACE/Scripts/v8.linux_arm64.args.gn $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/args.gn
          bash $GITHUB_WORKSPACE/Scripts/prepare_v8_build.sh $GITHUB_WORKSPACE/v8/v8 $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/args.gn "$V8_VERSION"
          ls -l $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/
          ninja -C ./out.gn/arm64.release v8_monolith

          cd $GITHUB_WORKSPACE
          mkdir -p staging/v8/linux.arm64.release
          cp $GITHUB_WORKSPACE/v8/v8/out.gn/arm64.release/obj/libv8_monolith.a staging/v8/linux.arm64.release/

      - name: Upload
        if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt_v8_linux_arm64
          path: staging/
